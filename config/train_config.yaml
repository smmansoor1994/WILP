# ============================================================
# YOLOrtho Training Hyperparameters
# Paper: https://arxiv.org/abs/2308.05967
# ============================================================

training:
  epochs: 100            # fallback if phase-specific values are not set
  phase1_epochs: 100       # Phase 1: detection pre-training from scratch
                           #   • Paper uses 100 epochs. Sample dataset (50 imgs) needs
                           #     fewer to converge, but 100 prevents under-fitting.
                           #   • More epochs → better FDI class separation → fewer
                           #     wrong tooth assignments → higher recall/precision.

  phase2_epochs: 100       # Phase 2: fine-tuning detection + all data incl. disease
                           #   • Start from Phase 1 best.pt → converges faster.
                           #   • 50 allows all 3 data-type branches to stabilise.

  phase2b_epochs: 100    # Phase 2b: attribute head fine-tuning (backbone frozen)
                         #   • Increased from 50 to 100 for better disease feature learning
                         #   • More iterations allow binary heads to discriminate disease features
                         #   • No backbone degradation (frozen) but better attr precision

  phase3_epochs: 100       # Phase 3 (Hybrid): Swin encoder + cross-attention + severity head
                           #   • Backbone + attr heads frozen; only new components trained.
                           #   • 50 epochs with CosineAnnealingLR (5e-4 → 1e-6) is enough
                           #     because the heads are shallow and the backbone is stable.
                           #   • Loss: AttributeBCE(w=4) + SeverityLoss(w=4) + QuadrantAux(w=1)
                           #   • Previously 30 — increased to 50.
                           #   • More epochs = better sensitivity (disease recall)
                           #     without harming specificity (backbone frozen,
                           #     so detection performance is not degraded).
                           #   • CosineAnnealingLR decays from 1e-3 → 1e-5 over
                           #     these epochs; 50 gives a gentler decay slope.

  batch_size: 4              # 4 is safe on T4/16GB at 1280px; use 8 only on A100/H100
  workers: 4                 # DataLoader worker threads
  seed: 42

  # Optimizer
  optimizer: "SGD"           # SGD or AdamW
  lr0: 0.01                  # Initial learning rate (Phase 1 — training from scratch)
  phase2_lr0: 0.002          # Initial learning rate for Phase 2 (fine-tuning from Phase 1).
                             #   Fine-tuning from pretrained weights needs a lower lr to
                             #   avoid immediately overshooting the good Phase 1 minimum.
                             #   0.01 caused the model to reach best mAP at epoch 2 then
                             #   oscillate for 50 epochs before early-stop. 0.001–0.003
                             #   keeps the Phase 1 knowledge while still improving. 
  lrf: 0.01                  # Final lr = lr0 * lrf (cosine decay)
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

  # Loss weights (from paper Section 2.2)
  # Standard YOLOv8 losses
  loss_box: 7.5              # Bounding box regression loss weight
  loss_cls: 0.5              # Classification loss weight
  loss_dfl: 1.5              # Distribution Focal Loss weight
  # Disease attribute losses (binary cross-entropy per attribute)
  # Weight 8.0 from paper. Raising attr loss weight increases sensitivity
  # (more disease detected) but risks false positives. Lowering improves
  # specificity. 8.0 is the paper's balanced recommendation.
  loss_attr: 8.0             # Disease attribute loss weight (same for all 4)

  # Hierarchical training flags
  # Controls which losses are computed per data part
  # 0 = quadrant only, 1 = quadrant+enumeration, 2 = all (with disease)
  hierarchical: true

  # Pseudo-label settings (for Part 3 healthy teeth labeling)
  pseudo_label_conf: 0.5     # Min confidence to accept pseudo label
  pseudo_model: null         # Path to trained model for pseudo labeling (auto-filled)

  # Disease attribute pos_weight for Phase 2b BCEWithLogitsLoss.
  # Counteracts class imbalance (most teeth are healthy → label=0).
  # Higher weight = penalize missing diseases more (improve RECALL).
  # CORRECTED: Previous value [8.0, 5.0, 12.0, 8.0] was too aggressive.
  # Resulted in 75% false positive rate (model predicting 3 diseases per tooth).
  # New: Balanced between recall and precision. Avoids over-aggressive predictions.
  # Conservative tuning: 1.2x baseline to improve disease detection without noise.
  attr_pos_weight: [6.0, 3.6, 9.6, 6.0]  # CORRECTED for balanced recall/precision

  # Validation interval (evaluate every N epochs)
  val_interval: 5

  # Checkpoint saving
  save_dir: "outputs/runs"
  save_best: true
  save_last: true

  # Early stopping patience (epochs without improvement)
  patience: 50

augmentation:
  # Enhanced augmentation for better disease feature generalization
  hsv_h: 0.015               # HSV hue augmentation (not critical for X-rays)
  hsv_s: 0.0                 # X-rays are grayscale — no saturation aug
  hsv_v: 0.6                 # INCREASED: 0.4→0.6 for wider exposure variation
                             #   • Disease features (cavities) visible under different exposures
                             #   • Simulates real clinical X-ray equipment differences
  degrees: 10.0              # INCREASED: 5.0→10.0 for broader rotation variation
                             #   • Mouth positioning varies; model needs rotation invariance
  translate: 0.1             # Translation (unchanged — adequate)
  scale: 0.7                 # INCREASED: 0.5→0.7 for more zoom variation
                             #   • Disease features appear at different magnifications
  shear: 2.0                 # Shear (unchanged — adequate)
  flipud: 0.0                # No vertical flip (skull anatomy — correct)
  fliplr: 0.5                # Horizontal flip WITH quadrant remapping (Section 2.1)
  mosaic: 0.0                # Disable mosaic (panoramic X-rays must not be mixed)
  mixup: 0.0                 # Disable mixup
  blur: 0.2                  # INCREASED: 0.1→0.2 for more motion/equipment blur
                             #   • X-ray artifacts and motion blur common in clinical images
  copy_paste: 0.0
